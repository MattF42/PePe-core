name: RC2 dependency network preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rc2-network-preflight.yml'
      - 'contrib/ci/network-preflight.sh'
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check runner and Docker network before dependency build
        run: contrib/ci/network-preflight.sh '${{ matrix.arch }}'
