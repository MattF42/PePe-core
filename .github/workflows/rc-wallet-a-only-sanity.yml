name: v2.9.0.6 Optional RC A+B+C source sanity
on:
  push:
    branches:
      - release/v2.9.0.6-rc2-optional-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sanity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate test syntax, wallet error reporting and isolation
        run: |
          set -euo pipefail
          python3 -m py_compile qa/rc-wallet-a/instrument.py qa/rc-wallet-a/wallet_persistence.py
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path("src/wallet/wallet.cpp").read_text()
          commit = cpp.split("bool CWallet::CommitTransaction(", 1)[1].split("bool CWallet::AddAccountingEntry(", 1)[0]
          assert "if (!AddToWallet(wtxNew, false, pwalletdb))" in commit
          assert "txid=%s" in commit and "Do not retry" in commit
          assert commit.index("wtxNew.AcceptToMemoryPool(false)") < commit.index("if (!AddToWallet(wtxNew, false, pwalletdb))") < commit.index("wtxNew.RelayWalletTransaction(")
          assert "strCommitError" in Path("src/wallet/wallet.h").read_text()
          assert "&commitError" in Path("src/qt/walletmodel.cpp").read_text()
          assert "ConsolidationPoolState" in Path("src/qt/coincontroldialog.cpp").read_text(), "B worker pool absent"
          assert "stopConsolidationWorkers()" in Path("src/qt/dash.cpp").read_text(), "B shutdown drain absent"
          assert "discarding orphan recovery replies" in Path("src/masternodeman.cpp").read_text(), "C guard absent"
          assert "edge-test-fail-wallet-write" not in cpp, "test hooks leaked to production"
          print("PASS: A+B+C source invariants and Python syntax. No C++ runtime test performed.")
          PY
