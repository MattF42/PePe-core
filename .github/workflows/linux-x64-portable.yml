name: Linux x86_64 portable test build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-x64-portable.yml'
      - 'contrib/linux-portable/**'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'build-aux/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request default checkout is a synthetic merge commit.
          # Pin the precise PR head for reproducible source/build provenance.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Export exact checkout and build toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/output"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/source"
          echo "Checking Ubuntu build mirror DNS on runner (diagnostic only)"
          getent ahostsv4 archive.ubuntu.com | head -3 || true
          getent ahostsv4 security.ubuntu.com | head -3 || true
          # Preserve the image/toolchain and source exactly; use runner host
          # networking for BuildKit, since isolated builder DNS failed in RC.
          docker build --network=host --progress=plain -t pepe-linux-portable contrib/linux-portable
      - name: Build and package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e "PEPE_SOURCE_SHA=$(git rev-parse HEAD)" \
            -v "$RUNNER_TEMP/source:/source:ro" -v "$RUNNER_TEMP/output:/output" \
            pepe-linux-portable /source/contrib/linux-portable/build.sh
          (cd "$RUNNER_TEMP/output" && tar -czf "$GITHUB_WORKSPACE/pepe-linux-x86_64-portable.tgz" .)
          sha256sum pepe-linux-x86_64-portable.tgz > SHA256SUMS-archive.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-linux-x86_64-portable
          path: |
            pepe-linux-x86_64-portable.tgz
            SHA256SUMS-archive.txt
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pepe-linux-x86_64-portable
      - name: Prepare test container and check package
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          sha256sum -c SHA256SUMS-archive.txt
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/test-image"
          tar -xzf pepe-linux-x86_64-portable.tgz -C "$RUNNER_TEMP/artifact"
          printf 'FROM ubuntu:%s\nRUN apt-get update && apt-get install -y --no-install-recommends binutils libgl1 fontconfig fonts-dejavu-core xvfb xauth && rm -rf /var/lib/apt/lists/*\n' "$UBUNTU_VERSION" > "$RUNNER_TEMP/test-image/Dockerfile"
          docker build -t pepe-compat "$RUNNER_TEMP/test-image"
          docker run --rm --network=none -v "$RUNNER_TEMP/artifact:/artifact:ro" \
            -v "$GITHUB_WORKSPACE/contrib/linux-portable/smoke.sh:/smoke.sh:ro" \
            pepe-compat bash /smoke.sh
