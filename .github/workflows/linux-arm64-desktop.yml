name: Linux ARM64 desktop test build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-arm64-desktop.yml'
      - 'contrib/linux-arm64-desktop/**'
      - 'depends/**'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'build-aux/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Export exact source and build ARM64 toolchain
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/output"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/source"
          docker build -t pepe-arm64-desktop contrib/linux-arm64-desktop
      - name: Build and package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e "PEPE_SOURCE_SHA=$(git rev-parse HEAD)" \
            -v "$RUNNER_TEMP/source:/source:ro" -v "$RUNNER_TEMP/output:/output" \
            pepe-arm64-desktop /source/contrib/linux-arm64-desktop/build.sh
          (cd "$RUNNER_TEMP/output" && tar -czf "$GITHUB_WORKSPACE/pepe-linux-arm64-desktop.tgz" .)
          sha256sum pepe-linux-arm64-desktop.tgz > SHA256SUMS-archive.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-linux-arm64-desktop
          path: |
            pepe-linux-arm64-desktop.tgz
            SHA256SUMS-archive.txt
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pepe-linux-arm64-desktop
      - name: Test on native ARM64 in a clean Ubuntu container
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          test "$(uname -m)" = aarch64
          sha256sum -c SHA256SUMS-archive.txt
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/test-image"
          tar -xzf pepe-linux-arm64-desktop.tgz -C "$RUNNER_TEMP/artifact"
          printf 'FROM ubuntu:%s\nRUN apt-get update && apt-get install -y --no-install-recommends binutils libgl1 fontconfig fonts-dejavu-core xvfb xauth && rm -rf /var/lib/apt/lists/*\n' "$UBUNTU_VERSION" > "$RUNNER_TEMP/test-image/Dockerfile"
          docker build -t pepe-arm64-compat "$RUNNER_TEMP/test-image"
          docker run --rm --network=none -v "$RUNNER_TEMP/artifact:/artifact:ro" \
            -v "$GITHUB_WORKSPACE/contrib/linux-arm64-desktop/smoke.sh:/smoke.sh:ro" \
            pepe-arm64-compat bash /smoke.sh
